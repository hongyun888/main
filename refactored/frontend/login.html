<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数智人登录界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            overflow: hidden;
            background-color: #0a1929;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0a1929 0%, #1a2a3d 100%);
        }

        .login-container {
            width: 850px;
            height: 500px;
            position: relative;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            background-color: rgba(13, 28, 50, 0.85);
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 更新的星空背景 */
        .star-background {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: starFloat 10s linear infinite;
        }

        .star.bright-to-dim {
            animation: starFloat 10s linear infinite, starBrightToDim 5s ease-in-out infinite;
        }

        .star.dim-to-bright {
            animation: starFloat 10s linear infinite, starDimToBright 5s ease-in-out infinite;
        }

        @keyframes starFloat {
            0% {
                transform: translateY(500px);
            }

            100% {
                transform: translateY(-50px);
            }
        }

        @keyframes starBrightToDim {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 0.2;
            }
        }

        @keyframes starDimToBright {

            0%,
            100% {
                opacity: 0.2;
            }

            50% {
                opacity: 0.6;
            }
        }

        /* 其余样式保持不变 */
        .window-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
        }

        .control-btn {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .minimize {
            background-color: #f1c40f;
        }

        .close {
            background-color: #e74c3c;
        }

        .control-btn:hover {
            transform: scale(1.2);
        }

        .control-icon {
            opacity: 0;
            transition: opacity 0.2s ease;
            font-size: 10px;
            color: #333;
        }

        .control-btn:hover .control-icon {
            opacity: 1;
        }

        .header {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 50px;
        }

        .header h1 {
            color: white;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .login-form {
            width: 340px;
            margin: 0 auto;
        }

        .form-group {
            position: relative;
            margin-bottom: 30px;
        }

        .form-control {
            width: 100%;
            height: 50px;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            padding: 10px 15px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-bottom: 2px solid #3498db;
        }

        .form-label {
            position: absolute;
            top: 15px;
            left: 15px;
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .form-control:focus+.form-label,
        .form-control:not(:placeholder-shown)+.form-label {
            top: -15px;
            left: 0;
            font-size: 12px;
            color: #3498db;
            font-weight: 500;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 15px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
            font-size: 18px;
        }

        .toggle-password:hover {
            color: white;
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .remember-me input[type="checkbox"] {
            margin-right: 10px;
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .remember-me input[type="checkbox"]:checked {
            background-color: #3498db;
            border-color: #3498db;
        }

        .remember-me input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
        }

        .remember-me label {
            color: white;
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            height: 50px;
            background: linear-gradient(45deg, #1a73e8, #3498db);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .login-btn:hover {
            background: linear-gradient(45deg, #1565c0, #2980b9);
            box-shadow: 0 7px 20px rgba(52, 152, 219, 0.6);
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 20px;
            text-align: center;
            height: 20px;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .error-message.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="star-background" id="starBackground"></div>
        <div class="header">
            <h1>欢迎使用数智人</h1>
        </div>

        <div class="login-form">
            <div class="form-group">
                <input type="text" class="form-control" id="username" placeholder=" " autocomplete="username">
                <label for="username" class="form-label">账号</label>
            </div>

            <div class="form-group">
                <input type="password" class="form-control" id="password" placeholder=" ">
                <label for="password" class="form-label">密码</label>
                <div class="toggle-password" id="togglePassword">⦿</div>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">记住密码</label>
            </div>

            <button class="login-btn" id="loginBtn">登录</button>

            <div class="error-message" id="errorMessage">账号或密码错误，请重新输入</div>
        </div>
    </div>

    <script>
        // 更新的星空背景生成函数
        function createStarryBackground() {
            const starBackground = document.getElementById('starBackground');
            const starCount = 150;
            const containerWidth = 850;
            const containerHeight = 500;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');

                const size = Math.random() * 2 + 0.5; // 尺寸范围从0.5-2.5px
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                let x, y;
                do {
                    x = Math.random() * containerWidth;
                    y = Math.random() * containerHeight;
                } while (
                    x > containerWidth * 0.3 && x < containerWidth * 0.7 &&
                    y > containerHeight * 0.3 && y < containerHeight * 0.7
                );

                star.style.left = `${x}px`;
                star.style.top = `${y}px`;

                const delay = Math.random() * 10; // 0-10秒的随机延迟
                star.style.animationDelay = `-${delay}s`;

                // 随机分配亮度变化方向
                if (Math.random() < 0.5) {
                    star.classList.add('bright-to-dim');
                } else {
                    star.classList.add('dim-to-bright');
                }

                starBackground.appendChild(star);
            }
        }

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassword.textContent = '⦾';
            } else {
                passwordInput.type = 'password';
                togglePassword.textContent = '⦿';
            }
        });

        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const rememberMeCheckbox = document.getElementById('rememberMe');

        loginBtn.addEventListener('click', function () {
            loginBtn.textContent = '登录中...';

            setTimeout(function () {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                login({username, password}, (res) => {
                    loginBtn.textContent = '登录成功';
                    sessionStorage.setItem('userInfo', JSON.stringify(res.data));
                    if (res.data.token) {
                        sessionStorage.setItem('token', res.data.token);
                    }
                    if (res.data.appCode) {
                        sessionStorage.setItem('appCode', res.data.appCode);
                    }
                    window.open('index.html', '_self')
                }, (err) => {
                    loginBtn.textContent = '登录';
                    errorMessage.classList.add('show');
                    setTimeout(function () {
                        errorMessage.classList.remove('show');
                    }, 3000);
                })
                if (rememberMeCheckbox.checked) {
                    localStorage.setItem('username', username);
                    localStorage.setItem('password', password);
                } else {
                    localStorage.removeItem('username');
                    localStorage.removeItem('password');
                }
            }, 1000);
        });

        window.addEventListener('load', function () {
            const savedUsername = localStorage.getItem('username');
            const savedPassword = localStorage.getItem('password');

            if (savedUsername) {
                document.getElementById('username').value = savedUsername;
                rememberMeCheckbox.checked = true;
            }

            if (savedPassword) {
                document.getElementById('password').value = savedPassword;
                rememberMeCheckbox.checked = true;
            }

            createStarryBackground();
        });
    </script>
    <script type="text/javascript" src="js/utils/util.js"></script>
</body>

</html>
